[project]
name = "tkrag"
version = "0.1.0"
description = "Hybrid RAG over the Russian Labor Code with honest evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.111",
    "httpx>=0.27",
    "pgvector>=0.3",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "sentence-transformers>=3.0",
    "torch>=2.5",  # direct dependency so [tool.uv.sources] below can pick the CUDA build
    "uvicorn>=0.30",
]

[project.scripts]
tkrag = "tkrag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0.12.20260906",
    "pgserver>=0.1.4",
]

# torch wheels per platform. PyPI's Windows wheel is CPU-only, so Windows takes the CUDA build
# (needs an NVIDIA GPU; on a machine without one it simply runs on the CPU). PyPI's Linux wheel
# drags in several GB of CUDA libraries, so Linux (CI, servers without GPU) takes the small CPU
# build. macOS keeps the PyPI wheel. Linux with a GPU: remove the linux line below.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tkrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a running Postgres with pgvector (deselected by default)",
]
addopts = "-m 'not db'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# The project is Russian: Cyrillic letters in strings and comments are intended.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long Russian legal sentences in test data

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
