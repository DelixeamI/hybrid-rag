services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tkrag-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tkrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tkrag}
      POSTGRES_DB: ${POSTGRES_DB:-tkrag}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tkrag} -d ${POSTGRES_DB:-tkrag}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
