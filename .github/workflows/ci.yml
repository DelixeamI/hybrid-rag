name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tkrag
          POSTGRES_PASSWORD: tkrag
          POSTGRES_DB: tkrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tkrag -d tkrag"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://tkrag:tkrag@localhost:5432/tkrag
      LLM_MODE: recorded
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Unit and database tests
        run: uv run pytest -m "db or not db"
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-e5-small-bge-reranker-v2-m3
      - name: Eval with recorded LLM (fails below eval_thresholds.yaml)
        run: uv run tkrag eval --dataset fixture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: reports/
